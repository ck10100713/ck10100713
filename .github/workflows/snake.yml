name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # 每天執行一次
  workflow_dispatch: # 允許手動觸發

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ck10100713
          outputs: |
            dist/github-snake.svg?color_snake=#0077B6&color_dots=#023E8A,#0096C7,#48CAE4,#90E0EF,#CAF0F8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#48CAE4&color_dots=#001845,#023E8A,#0077B6,#0096C7,#00B4D8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
